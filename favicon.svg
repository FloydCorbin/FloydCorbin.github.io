      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="48%" stop-color="#ed1f33"/>
      <stop offset="100%" stop-color="#b9121f"/>
    </linearGradient>
    <linearGradient id="cyanStroke" x1="0" x2="1" y1="0" y2="1">
