  <circle cx="164" cy="223" r="38" fill="#1bbde7" stroke="#f7f7f7" stroke-width="10"/>
  <circle cx="264" cy="168" r="38" fill="#1bbde7" stroke="#f7f7f7" stroke-width="10"/>
  <circle cx="338" cy="330" r="38" fill="#1bbde7" stroke="#f7f7f7" stroke-width="10"/>
