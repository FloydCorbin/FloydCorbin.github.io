  />

  <circle cx="168" cy="233" r="38" fill="#1bc1ea" stroke="#f7f7f7" stroke-width="10"/>
  <circle cx="286" cy="186" r="38" fill="#1bc1ea" stroke="#f7f7f7" stroke-width="10"/>
  <circle cx="356" cy="333" r="38" fill="#1bc1ea" stroke="#f7f7f7" stroke-width="10"/>
