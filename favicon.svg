<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Floyd Corbin favicon</title>
  <desc>A stylized red F with cyan accent details and a black background.</desc>
  <defs>
    <linearGradient id="redFill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ff4a4a"/>
      <stop offset="45%" stop-color="#ee1f32"/>
      <stop offset="100%" stop-color="#b80d1d"/>
    </linearGradient>
    <linearGradient id="cyanStroke" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#a9f0ff"/>
      <stop offset="50%" stop-color="#3ed4ff"/>
      <stop offset="100%" stop-color="#10b8db"/>
